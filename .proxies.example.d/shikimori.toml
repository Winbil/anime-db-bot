# Profile: shikimori
# Per-profile outbound proxy pool. Missing/disabled entries mean direct access.
# If at least one proxy is enabled, this profile never silently falls back to direct.
# Duplicate URLs are allowed (use distinct names); duplicates can intentionally weight rotation.

enabled = true

