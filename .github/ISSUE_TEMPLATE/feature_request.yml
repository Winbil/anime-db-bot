name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first. New providers or identity behavior should preserve the project's source-independent and conflict-safe design.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior, not only an implementation idea.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or existing features did you consider?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Search / discovery
        - Identity / mappings
        - Metadata source
        - Characters / people
        - Episodes / trailers
        - Telegram UI / localization
        - Persistence / user settings
        - Deployment / operations
        - Developer tooling / CI
        - Other
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: External source details
      description: If this request adds an API/provider, include official documentation, authentication requirements, rate limits, and terms if known.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and roadmap items for this request.
          required: true
        - label: This request does not depend on treating one external anime database as globally canonical.
          required: true
