name: One-shot cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add one-shot cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify final refactor landed
        run: |
          test -f core/score_summary.py
          test -f bots/telegram/editing.py
          test -f tests/test_score_summary.py
          test -f tests/test_editing.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Remove temporary infrastructure
        run: |
          rm -f .github/workflows/refactor-once.yml
          rm -f .github/workflows/cleanup-once.yml
          rm -f scripts/finalize_refactor.py

      - name: Compile and test final tree
        run: |
          python -m compileall -q bots core localization mappings search services sources tests
          python -m unittest discover -s tests -v

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove one-shot refactor infrastructure"
          git push origin HEAD:main
