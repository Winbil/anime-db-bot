name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q bots core localization mappings search services sources tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock -r requirements-dev.txt
          python -m pip check

      - name: Lint Python for correctness errors
        run: ruff check bots core localization mappings search services sources tests --select E9,F63,F7,F82

      - name: Check formatting of typed foundation
        run: ruff format --check core/source_keys.py core/source_errors.py core/http_client.py core/temporal.py core/models.py core/people.py core/cache.py core/sqlite.py core/logging_config.py core/capabilities.py core/contracts.py bots/telegram/callbacks.py bots/telegram/admin.py bots/telegram/search/handlers.py bots/telegram/bot.py bots/telegram/card/runtime/state.py bots/telegram/card/runtime/handlers.py bots/telegram/card/views/renderer.py bots/telegram/card/views/rendering.py bots/telegram/card/views/main.py bots/telegram/card/views/popularity.py bots/telegram/card/views/titles.py bots/telegram/card/views/sections.py bots/telegram/card/features/screenshots.py bots/telegram/people/loading.py bots/telegram/people/portraits.py bots/telegram/transports/__init__.py bots/telegram/transports/official.py bots/telegram/transports/tgapi.py bots/telegram/card/ui/selectors.py bots/telegram/card/runtime/service.py bots/telegram/card/features/episodes.py bots/telegram/card/features/characters.py bots/telegram/card/features/trailers.py services/runtime/app_context.py services/identity/resolver.py services/identity/direct_lookup.py services/identity/aggregator.py services/aggregation/merge.py services/search/service.py services/media/episodes.py services/users/access_control.py mappings/resolver.py mappings/database.py services/users/bans.py services/runtime/rate_limits.py services/users/settings.py bots/telegram/rate_limit.py services/media/people.py services/runtime/source_health.py services/media/characters.py services/media/trailers.py sources/runtime/catalog.py search/registry.py sources/runtime/registry.py sources/runtime/episode_registry.py sources/runtime/trailer_registry.py sources/providers/anilist.py sources/providers/shikimori.py sources/providers/shikimori_people_runtime.py sources/providers/shikimori_people.py sources/providers/trailers.py sources/runtime/resilient.py

      - name: Type-check typed foundation
        run: >-
          mypy --ignore-missing-imports --follow-imports=skip
          core/source_keys.py core/settings.py core/source_errors.py core/temporal.py core/models.py core/people.py core/cache.py core/sqlite.py core/logging_config.py core/capabilities.py core/contracts.py bots/telegram/callbacks.py bots/telegram/admin.py bots/telegram/search/handlers.py bots/telegram/bot.py bots/telegram/card/runtime/state.py bots/telegram/card/runtime/handlers.py bots/telegram/card/views/renderer.py bots/telegram/card/views/rendering.py bots/telegram/card/views/main.py bots/telegram/card/views/popularity.py bots/telegram/card/views/titles.py bots/telegram/card/views/sections.py bots/telegram/card/features/screenshots.py bots/telegram/people/loading.py bots/telegram/people/portraits.py bots/telegram/transports/__init__.py bots/telegram/transports/official.py bots/telegram/transports/tgapi.py bots/telegram/card/ui/selectors.py bots/telegram/card/runtime/service.py bots/telegram/card/features/episodes.py bots/telegram/card/features/characters.py bots/telegram/card/features/trailers.py services/search/service.py services/media/episodes.py services/users/access_control.py services/runtime/source_health.py services/media/people.py services/media/characters.py services/media/trailers.py sources/runtime/catalog.py search/registry.py sources/runtime/registry.py sources/runtime/episode_registry.py sources/runtime/trailer_registry.py sources/providers/anilist.py sources/providers/shikimori.py sources/providers/mal.py sources/providers/shikimori_people_runtime.py sources/providers/shikimori_people.py sources/providers/trailers.py sources/runtime/resilient.py

      - name: Run tests with coverage gate
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=70

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check shell scripts
        run: shellcheck start.sh scripts/*.sh
