name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q bots core localization mappings search services sources tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock -r requirements-dev.txt
          python -m pip check

      - name: Lint Python for correctness errors
        run: ruff check bots core localization mappings search services sources tests --select E9,F63,F7,F82

      - name: Check formatting of typed foundation
        run: ruff format --check core/source_keys.py core/source_errors.py core/http_client.py core/temporal.py services/app_context.py

      - name: Type-check typed foundation
        run: >-
          mypy --ignore-missing-imports --follow-imports=skip
          core/source_keys.py core/settings.py core/source_errors.py core/temporal.py services/source_health.py

      - name: Run tests with coverage gate
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=70

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check shell scripts
        run: shellcheck start.sh scripts/*.sh
