name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q bots core localization mappings search services sources tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock -r requirements-dev.txt
          python -m pip check

      - name: Lint Python for correctness errors
        run: ruff check bots core localization mappings search services sources tests --select E9,F63,F7,F82

      - name: Check formatting of typed foundation
        run: ruff format --check core/source_keys.py core/source_errors.py core/http_client.py core/temporal.py core/models.py core/people.py core/cache.py core/sqlite.py core/logging_config.py core/capabilities.py core/contracts.py bots/telegram/callbacks.py bots/telegram/admin.py bots/telegram/search_ui.py bots/telegram/bot.py bots/telegram/card/state.py bots/telegram/card/handlers.py bots/telegram/card/renderer.py bots/telegram/card/rendering.py bots/telegram/card/main_view.py bots/telegram/card/popularity.py bots/telegram/card/titles.py bots/telegram/card/sections.py bots/telegram/card/screenshots.py bots/telegram/people_loading.py bots/telegram/people_portraits.py bots/telegram/transports/__init__.py bots/telegram/transports/official.py bots/telegram/transports/tgapi.py bots/telegram/card/selectors.py bots/telegram/card/service.py bots/telegram/card/episodes.py bots/telegram/card/characters.py bots/telegram/card/trailers.py services/app_context.py services/id_resolver.py services/direct_lookup.py services/identity_aggregator.py services/aggregation_merge.py services/search.py services/episodes.py services/access_control.py mappings/resolver.py mappings/database.py services/bans.py services/rate_limits.py services/user_settings.py bots/telegram/rate_limit.py services/people_progress.py services/source_health.py services/characters.py services/trailers.py sources/catalog.py search/registry.py sources/registry.py sources/episode_registry.py sources/trailer_registry.py sources/anilist.py sources/shikimori.py sources/shikimori_people_runtime.py sources/shikimori_people.py sources/trailers.py sources/resilient.py

      - name: Type-check typed foundation
        run: >-
          mypy --ignore-missing-imports --follow-imports=skip
          core/source_keys.py core/settings.py core/source_errors.py core/temporal.py core/models.py core/people.py core/cache.py core/sqlite.py core/logging_config.py core/capabilities.py core/contracts.py bots/telegram/callbacks.py bots/telegram/admin.py bots/telegram/search_ui.py bots/telegram/bot.py bots/telegram/card/state.py bots/telegram/card/handlers.py bots/telegram/card/renderer.py bots/telegram/card/rendering.py bots/telegram/card/main_view.py bots/telegram/card/popularity.py bots/telegram/card/titles.py bots/telegram/card/sections.py bots/telegram/card/screenshots.py bots/telegram/people_loading.py bots/telegram/people_portraits.py bots/telegram/transports/__init__.py bots/telegram/transports/official.py bots/telegram/transports/tgapi.py bots/telegram/card/selectors.py bots/telegram/card/service.py bots/telegram/card/episodes.py bots/telegram/card/characters.py bots/telegram/card/trailers.py services/search.py services/episodes.py services/access_control.py services/source_health.py services/people_progress.py services/characters.py services/trailers.py sources/catalog.py search/registry.py sources/registry.py sources/episode_registry.py sources/trailer_registry.py sources/anilist.py sources/shikimori.py sources/mal.py sources/shikimori_people_runtime.py sources/shikimori_people.py sources/trailers.py sources/resilient.py

      - name: Run tests with coverage gate
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=70

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check shell scripts
        run: shellcheck start.sh scripts/*.sh
