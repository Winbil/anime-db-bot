name: Apply validated final refactor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run validated final refactor'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Apply validated refactor
        run: python scripts/finalize_refactor.py

      - name: Verify final tree
        run: |
          test -f core/character_identity.py
          test -f core/score_summary.py
          test ! -f scripts/finalize_refactor.py
          test ! -f .github/workflows/refactor-once.yml
          test ! -f .github/workflows/cleanup-once.yml
          ! grep -RIn --include='*.py' 'split_text(.*\[0\]' bots
          ! grep -RIn --include='*.py' '_average_score' core services tests

      - name: Compile and test
        run: |
          python -m compileall -q bots core localization mappings search services sources tests
          python -m unittest discover -s tests -v

      - name: Commit final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finish character score and fallback refactors"
          git push origin HEAD:main
